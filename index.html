<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Sovereign Quest • For You</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #040207;
      height: 100vh;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      color: #f8ece1;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .hud {
      position: relative;
      z-index: 2;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 32px 20px 45px;
      pointer-events: none;
    }

    .top-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .steps-bar {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .step-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      border: 1px solid rgba(234, 195, 139, 0.35);
      transition: all 0.5s ease;
    }

    .step-dot.active {
      background: #eac38b;
      box-shadow: 0 0 14px #eac38b, 0 0 28px #f497b6;
      transform: scale(1.35);
    }

    .step-dot.done {
      background: #f497b6;
      border-color: #f497b6;
      box-shadow: 0 0 10px #f497b6;
    }

    .timer-box {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      letter-spacing: 4px;
      color: #eac38b;
      text-shadow: 0 0 15px rgba(234, 195, 139, 0.4);
      transition: color 0.3s, transform 0.2s;
    }

    .timer-box.danger {
      color: #ff4d6d;
      text-shadow: 0 0 22px rgba(255, 77, 109, 0.9);
      transform: scale(1.15);
    }

    .cipher-panel {
      display: none;
      pointer-events: auto;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      margin-top: 110px;
    }

    .cipher-display {
      display: flex;
      gap: 16px;
    }

    .cipher-slot {
      width: 44px;
      height: 54px;
      border-bottom: 2px solid rgba(234, 195, 139, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px;
      color: #fff6eb;
      text-shadow: 0 0 12px #eac38b;
    }

    .cipher-pad {
      display: grid;
      grid-template-columns: repeat(3, 54px);
      gap: 12px;
    }

    .cipher-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 1px solid rgba(234, 195, 139, 0.35);
      background: rgba(255, 255, 255, 0.03);
      color: #eac38b;
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .cipher-btn:hover {
      background: rgba(234, 195, 139, 0.18);
      border-color: #eac38b;
      transform: scale(1.06);
    }

    .cipher-btn:active {
      transform: scale(0.94);
    }

    .quest-prompt {
      text-align: center;
      transition: opacity 0.6s ease;
    }

    .quest-step-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      letter-spacing: 6px;
      color: #eac38b;
      margin-bottom: 5px;
    }

    .quest-title {
      font-size: 12px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(248, 236, 225, 0.92);
      font-weight: 400;
    }

    .quest-sub {
      margin-top: 6px;
      font-size: 10px;
      letter-spacing: 3px;
      color: rgba(234, 195, 139, 0.7);
      text-transform: uppercase;
    }

    .finale-box {
      display: none;
      text-align: center;
      animation: grandReveal 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .finale-box h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(38px, 7vw, 68px);
      font-weight: 400;
      letter-spacing: 12px;
      text-transform: uppercase;
      background: linear-gradient(120deg, #fff6eb 0%, #eac38b 35%, #f497b6 65%, #fff6eb 100%);
      background-size: 250% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 4s linear infinite;
      filter: drop-shadow(0 0 30px rgba(234, 195, 139, 0.45));
    }

    .replay-audio {
      pointer-events: auto;
      margin-top: 22px;
      display: inline-block;
      padding: 10px 26px;
      border-radius: 30px;
      border: 1px solid rgba(234, 195, 139, 0.35);
      background: rgba(255, 255, 255, 0.03);
      color: #eac38b;
      font-size: 11px;
      letter-spacing: 4px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .replay-audio:hover {
      background: rgba(234, 195, 139, 0.15);
      border-color: #eac38b;
    }

    @keyframes shimmer {
      to { background-position: 250% center; }
    }

    @keyframes grandReveal {
      0% { opacity: 0; transform: scale(0.85) translateY(25px); filter: blur(8px); }
      100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
    }
  </style>
</head>
<body>

  <canvas id="questCanvas"></canvas>

  <div class="hud">
    <div class="top-bar">
      <div class="steps-bar">
        <div class="step-dot active" id="dot1"></div>
        <div class="step-dot" id="dot2"></div>
        <div class="step-dot" id="dot3"></div>
        <div class="step-dot" id="dot4"></div>
        <div class="step-dot" id="dot5"></div>
        <div class="step-dot" id="dot6"></div>
        <div class="step-dot" id="dot7"></div>
      </div>
      <div class="timer-box" id="timerDisplay">14.0s</div>
    </div>

    <div class="cipher-panel" id="cipherPanel">
      <div class="cipher-display">
        <div class="cipher-slot" id="slot0">·</div>
        <div class="cipher-slot" id="slot1">·</div>
        <div class="cipher-slot" id="slot2">·</div>
      </div>
      <div class="cipher-pad" id="cipherPad"></div>
    </div>

    <div class="finale-box" id="finaleBox">
      <h1>Happy Birthday</h1>
      <div class="replay-audio" id="replayBtn">♫ REPLAY MELODY</div>
    </div>

    <div class="quest-prompt" id="questPrompt">
      <div class="quest-step-num" id="stepNum">I / VII</div>
      <div class="quest-title" id="stepTitle">CELESTIAL HIERARCHY</div>
      <div class="quest-sub" id="stepSub">IGNITE ALL 6 STARS FROM SMALLEST TO LARGEST</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
